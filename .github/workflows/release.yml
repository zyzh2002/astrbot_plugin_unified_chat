name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release versions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path('.')
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          versions = {
              'pyproject.toml': tomllib.loads(
                  (root / 'pyproject.toml').read_text(encoding='utf-8')
              )['project']['version'],
              'rust/Cargo.toml': tomllib.loads(
                  (root / 'rust/Cargo.toml').read_text(encoding='utf-8')
              )['package']['version'],
              'metadata.yaml': re.search(
                  r'(?m)^version:\s*([^\s#]+)',
                  (root / 'metadata.yaml').read_text(encoding='utf-8'),
              ).group(1).strip('"\''),
              'unified_chat/__init__.py': re.search(
                  r'(?m)^__version__\s*=\s*["\']([^"\']+)',
                  (root / 'unified_chat/__init__.py').read_text(encoding='utf-8'),
              ).group(1),
          }
          mismatches = {source: value for source, value in versions.items() if value != tag}
          if mismatches:
              raise SystemExit(f'release version mismatch: expected {tag}, got {mismatches}')
          PY

  build:
    needs: version
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_28"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            manylinux: "auto"
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: "auto"
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --strip --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums and version guard
        shell: bash
        run: |
          TAG_NUM="${GITHUB_REF_NAME#v}"
          for w in dist/*.whl; do
            case "$(basename "$w")" in
              *-"${TAG_NUM}"-*) ;;
              *) echo "::error::wheel version mismatch: $w"; exit 1 ;;
            esac
          done
          cd dist && sha256sum *.whl > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
