[project]
name = "astrbot-plugin-unified-chat"
version = "0.2.0"
description = "Unified conversational intelligence for AstrBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "maturin>=1.7",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
e2e = ["astrbot>=4.27.3,<5.0.0"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "unified_chat._native"
bindings = "pyo3"
strip = true
manifest-path = "rust/Cargo.toml"

# Distributed wheels stay on baseline x86-64: targeting x86-64-v3 emits AVX2
# codegen that SIGILLs on older CPUs before the Python fallback can engage.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportAttributeAccessIssue = "none"
reportAssignmentType = "none"
extraPaths = ["./"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not fullboot'"
markers = [
  "fullboot: boots a real AstrBot subprocess; slow, run explicitly with -m fullboot",
]

[tool.coverage.run]
source = ["unified_chat"]
branch = true
