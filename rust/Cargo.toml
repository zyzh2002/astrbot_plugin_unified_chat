[package]
name = "unified_chat_native"
version = "0.2.0"
edition = "2021"
description = "Native acceleration for unified_chat (PyO3)"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }
rayon = "1.10"

# Release profile is defined at workspace root Cargo.toml
